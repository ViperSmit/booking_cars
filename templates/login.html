<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<script src="/static/header.js" defer></script>
<title>Вход</title>
<style>
:root {
    --bg: #edf2f7;
    --panel: rgba(255, 255, 255, 0.94);
    --line: #d8e1ec;
    --text: #122033;
    --muted: #5b6b7f;
    --primary: #1f4b99;
    --primary-strong: #173b7a;
    --red: #cf3f3f;
    --shadow: 0 20px 48px rgba(18, 32, 51, 0.12);
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font-family: Aptos, "Segoe UI", sans-serif;
    color: var(--text);
    background:
        radial-gradient(circle at top left, rgba(31, 75, 153, 0.10), transparent 30%),
        linear-gradient(180deg, #f8fafc 0%, var(--bg) 100%);
}

.login-shell {
    flex: 1;
    display: grid;
    place-items: center;
    padding: 24px 16px 32px;
}

.card {
    width: min(420px, calc(100% - 32px));
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 24px;
    box-shadow: var(--shadow);
    padding: 28px;
}

.eyebrow {
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
}

h1 {
    margin: 0;
    color: var(--primary-strong);
    font-size: 34px;
}

.subtitle {
    margin-top: 12px;
    color: var(--muted);
    line-height: 1.55;
}

form {
    display: grid;
    gap: 16px;
    margin-top: 22px;
}

label {
    display: grid;
    gap: 6px;
    font-weight: 700;
}

input {
    width: 100%;
    box-sizing: border-box;
    padding: 11px 12px;
    border-radius: 12px;
    border: 1px solid #ccd6e3;
    font: inherit;
}

button {
    border: 0;
    border-radius: 12px;
    background: var(--primary);
    color: white;
    padding: 12px 16px;
    cursor: pointer;
    font: inherit;
    font-weight: 700;
}

.error {
    color: var(--red);
    font-weight: 700;
    margin-top: 8px;
}

.hint {
    margin-top: 18px;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.5;
}
</style>
<link rel="stylesheet" href="/static/theme.css">
</head>
<body>
{% include "includes/app_header.html" %}
<div class="login-shell">
<section class="card">
    <div class="eyebrow">Контроль доступа</div>
    <h1>Вход в систему</h1>
    <div class="subtitle">Авторизация нужна для доступа к календарю, управлению автопарком и журналу изменений.</div>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post">
        <input type="hidden" name="next" value="{{ next_url }}">
        <label>
            Логин
            <input name="username" autocomplete="username" required>
        </label>
        <label>
            Пароль
            <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <button type="submit">Войти</button>
    </form>

    <div class="hint">
        Дефолтные пользователи после инициализации БД: `admin` и `viewer`.
    </div>
</section>
</div>
</body>
</html>
